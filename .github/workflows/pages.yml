name: Town Heritage · Check and review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extra_query:
        description: Optional additional Europeana keyword query (up to 500 characters)
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: townheritage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test application logic
        run: node --test tests/*.test.mjs
      - name: Test collector and publication safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Decide whether a capture is needed
        id: capture
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          needed = os.environ['EVENT_NAME'] == 'workflow_dispatch' or not Path('data/europeana.json').exists()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'needed={str(needed).lower()}\n')
          PYCODE
      - name: Capture real Europeana results
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.capture.outputs.needed == 'true'
        env:
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          EXTRA_QUERY: ${{ inputs.extra_query }}
        run: python3 scripts/collect.py --query "$EXTRA_QUERY"
      - name: Preserve sanitized capture
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.capture.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/europeana.json
          if ! git diff --cached --quiet; then
            git commit -m "Record manual Europeana review capture"
            git push origin HEAD:main
          fi
      - name: Build review site
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 scripts/build.py --require-data
          else
            python3 scripts/build.py
          fi
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Exercise gallery in Chromium
        run: python3 tests/browser_smoke.py
      - name: Save review artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: townheritage-review
          path: dist/
          include-hidden-files: true
          retention-days: 30
      - name: Package Pages review site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
